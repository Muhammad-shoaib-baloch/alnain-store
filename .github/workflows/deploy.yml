# Auto-deploy: har push pe site build ho kar NetSoul (cPanel) pe FTP se upload hoti hai.
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions → in 3 secrets add karein:
#   FTP_SERVER   → ftp.aapkadomain.pk   (cPanel → FTP Accounts mein likha hota hai)
#   FTP_USERNAME → FTP account username
#   FTP_PASSWORD → FTP account password
# Note: FTP account banate waqt uski Directory "public_html" rakhein.

name: Deploy to NetSoul

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Upload to hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ./
